<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重要事項同意書 | Wawasan Global Support Limited</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Hiragino Sans','Meiryo','Yu Gothic',sans-serif;background:#eef2f7;color:#1a1a2e;min-height:100vh;font-size:15px;line-height:1.7}

    /* HEADER */
    header{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    .header-left .logo{font-size:17px;font-weight:bold}
    .header-left .tagline{font-size:12px;opacity:.75;margin-top:3px}
    .lang-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:3px;gap:2px}
    .lang-btn{padding:7px 20px;border-radius:999px;border:none;font-size:13px;font-weight:bold;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.7);background:transparent}
    .lang-btn.active{background:#fff;color:#1e3a8a}

    /* PROGRESS */
    .progress-bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 24px}
    .steps{display:flex;align-items:center;max-width:640px;margin:0 auto}
    .step{display:flex;align-items:center;gap:8px;flex:1}
    .step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;flex-shrink:0}
    .step-num.done{background:#16a34a;color:#fff}
    .step-num.active{background:#1e3a8a;color:#fff;box-shadow:0 0 0 4px #bfdbfe}
    .step-num.pending{background:#e5e7eb;color:#9ca3af}
    .step-label{font-size:12px;color:#6b7280;font-weight:500}
    .step-label.active{color:#1e3a8a;font-weight:bold}
    .step-line{flex:1;height:2px;background:#e5e7eb;margin:0 4px}
    .step-line.done{background:#16a34a}

    /* MAIN */
    main{max-width:780px;margin:28px auto;padding:0 16px 80px}
    .card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.09);overflow:hidden}

    /* SECTION HEADERS */
    .step-header{padding:30px 36px 22px;border-bottom:1px solid #f0f2f5}
    .step-header h2{font-size:22px;color:#1e3a8a;margin-bottom:8px;font-weight:700}
    .step-header p{font-size:14px;color:#6b7280;line-height:1.8}

    /* STEP 1: PRODUCT SELECTION */
    .product-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:26px 36px 36px}
    .product-option{border:2px solid #e5e7eb;border-radius:14px;padding:22px 20px;cursor:pointer;transition:all .2s;position:relative}
    .product-option:hover{border-color:#93c5fd;background:#f0f9ff;transform:translateY(-1px)}
    .product-option.selected{border-color:#1e3a8a;background:#eff6ff;box-shadow:0 0 0 3px #bfdbfe}
    .product-option input[type=radio]{position:absolute;opacity:0}
    .product-type-badge{font-size:11px;font-weight:bold;border-radius:5px;padding:3px 10px;display:inline-block;margin-bottom:10px}
    .badge-evolution{background:#fef3c7;color:#92400e}
    .badge-sp500{background:#dbeafe;color:#1e40af}
    .badge-fip{background:#dcfce7;color:#166534}
    .badge-platinum{background:#f3e8ff;color:#6b21a8}
    .product-name{font-size:16px;font-weight:bold;color:#1a1a2e;line-height:1.4}
    .check-icon{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:#1e3a8a;color:#fff;display:none;align-items:center;justify-content:center;font-size:14px}
    .product-option.selected .check-icon{display:flex}

    /* CONSENT HEADER */
    .consent-header{padding:26px 36px 18px;border-bottom:1px solid #f0f2f5}
    .product-badge{display:inline-flex;align-items:center;gap:6px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:7px 14px;font-size:13px;color:#1e40af;font-weight:bold;margin-bottom:14px}
    .consent-header h2{font-size:18px;color:#1e3a8a;margin-bottom:12px;font-weight:700;line-height:1.5}
    .preamble{font-size:13px;color:#4b5563;line-height:1.9;background:#f8fafc;border-left:4px solid #3b82f6;padding:14px 18px;border-radius:0 8px 8px 0}

    /* NOTICE */
    .notice-box{margin:18px 36px;background:#fff7ed;border:2px solid #fb923c;border-radius:10px;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
    .notice-icon{font-size:22px;flex-shrink:0;margin-top:1px}
    .notice-box p{font-size:13px;color:#9a3412;line-height:1.8;font-weight:500}

    /* ARTICLES */
    .articles{padding:6px 36px 8px}
    .article{border:1.5px solid #e5e7eb;border-radius:12px;margin-bottom:18px;overflow:hidden}
    .article-title{background:#f1f5f9;padding:14px 18px;font-size:14px;font-weight:700;color:#1e3a8a;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .article-title-text{flex:1;line-height:1.4}
    .article-body{padding:16px 18px;font-size:14px;color:#374151;line-height:1.9}
    .article-body p{margin-bottom:8px}
    .article-body p:last-of-type{margin-bottom:0}
    .risk{color:#dc2626;font-weight:700}

    /* INITIAL ROW */
    .initial-row{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1.5px dashed #d1d5db;flex-wrap:wrap}
    .initial-label{font-size:13px;color:#374151;font-weight:600;white-space:nowrap}
    .initial-input{border:2px solid #d1d5db;border-radius:8px;padding:8px 12px;font-size:15px;width:110px;text-align:center;letter-spacing:3px;font-weight:bold;transition:border-color .2s}
    .initial-input:focus{outline:none;border-color:#1e3a8a;box-shadow:0 0 0 3px #bfdbfe}
    .initial-hint{font-size:12px;color:#6b7280;background:#f3f4f6;padding:4px 10px;border-radius:6px}
    .initial-check{width:26px;height:26px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9ca3af;flex-shrink:0;transition:all .2s}
    .initial-check.filled{background:#16a34a;color:#fff}

    /* SIGNATURE */
    .signature-section{padding:22px 36px 32px}
    .sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
    .field-group label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:7px}
    .field-group input{width:100%;border:2px solid #d1d5db;border-radius:10px;padding:12px 14px;font-size:15px;transition:border-color .2s}
    .field-group input:focus{outline:none;border-color:#1e3a8a;box-shadow:0 0 0 3px #bfdbfe}
    .field-full{grid-column:1/-1}
    .confirm-box{background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:12px;padding:18px 20px;margin-bottom:20px}
    .confirm-box strong{color:#374151;display:block;margin-bottom:10px;font-size:14px}
    .confirm-row{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
    .confirm-key{font-size:12px;color:#9ca3af;min-width:90px}
    .confirm-val{font-weight:bold;color:#1e3a8a}
    .agree-check{display:flex;align-items:flex-start;gap:12px;background:#f0fdf4;border:2px solid #86efac;border-radius:12px;padding:16px 18px;margin-bottom:24px;cursor:pointer}
    .agree-check input[type=checkbox]{width:20px;height:20px;flex-shrink:0;margin-top:3px;accent-color:#16a34a;cursor:pointer}
    .agree-check-text{font-size:13px;color:#166534;line-height:1.8;font-weight:500}

    /* COMPLETE */
    .complete-section{text-align:center;padding:50px 36px 40px}
    .complete-icon{width:80px;height:80px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 22px}
    .complete-section h2{font-size:24px;color:#16a34a;margin-bottom:14px;font-weight:700}
    .complete-ref{display:inline-block;background:#f3f4f6;border-radius:10px;padding:12px 28px;font-size:18px;color:#374151;font-family:monospace;margin:16px 0;letter-spacing:2px;font-weight:bold}
    .email-sent-note{font-size:13px;color:#6b7280;margin-bottom:10px}
    .next-steps-box{background:#fffbeb;border:2px solid #fcd34d;border-radius:12px;padding:18px 22px;margin:24px 0;text-align:left}
    .next-steps-box strong{color:#92400e;display:block;margin-bottom:8px;font-size:14px}
    .next-steps-box p{font-size:13px;color:#78350f;line-height:1.8}
    .done-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:18px 22px;margin-top:0;text-align:left}
    .done-box strong{color:#374151;display:block;margin-bottom:10px;font-size:14px}
    .done-row{display:flex;gap:10px;margin-bottom:6px;font-size:13px}
    .done-key{color:#9ca3af;min-width:80px}
    .restart-btn{display:inline-block;margin-top:24px;padding:13px 36px;background:#1e3a8a;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;transition:all .2s}
    .restart-btn:hover{background:#1d4ed8;transform:translateY(-1px)}

    /* BUTTONS */
    .btn-row{display:flex;gap:12px;padding:20px 36px;border-top:1px solid #f0f2f5}
    .btn{padding:14px 28px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;border:none;transition:all .2s}
    .btn-primary{background:#1e3a8a;color:#fff;flex:1}
    .btn-primary:hover:not(:disabled){background:#1d4ed8;transform:translateY(-1px)}
    .btn-primary:disabled{background:#93c5fd;cursor:not-allowed}
    .btn-secondary{background:#f3f4f6;color:#374151}
    .btn-secondary:hover{background:#e5e7eb}
    .btn-success{background:#16a34a;color:#fff;flex:1}
    .btn-success:hover:not(:disabled){background:#15803d;transform:translateY(-1px)}
    .btn-success:disabled{background:#86efac;cursor:not-allowed}

    .screen{display:none}
    .screen.active{display:block}

    @media(max-width:620px){
      .product-grid{grid-template-columns:1fr}
      .sig-grid{grid-template-columns:1fr}
      main{padding:0 8px 80px}
      .step-header,.consent-header,.articles,.signature-section,.btn-row{padding-left:20px;padding-right:20px}
      .notice-box{margin:16px 20px}
      header{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="logo">Wawasan Global Support Limited</div>
    <div class="tagline" id="hTagline">重要事項同意書 — オンライン承認システム</div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btnJA" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" id="btnEN" onclick="setLang('en')">English</button>
  </div>
</header>

<!-- PROGRESS -->
<div class="progress-bar">
  <div class="steps">
    <div class="step">
      <div class="step-num active" id="pnum1">1</div>
      <div class="step-label active" id="plabel1">商品選択</div>
    </div>
    <div class="step-line" id="pline1"></div>
    <div class="step">
      <div class="step-num pending" id="pnum2">2</div>
      <div class="step-label" id="plabel2">重要事項確認</div>
    </div>
    <div class="step-line" id="pline2"></div>
    <div class="step">
      <div class="step-num pending" id="pnum3">3</div>
      <div class="step-label" id="plabel3">署名・承認</div>
    </div>
    <div class="step-line" id="pline3"></div>
    <div class="step">
      <div class="step-num pending" id="pnum4">4</div>
      <div class="step-label" id="plabel4">完了</div>
    </div>
  </div>
</div>

<main>

  <!-- SCREEN 1: 商品選択 -->
  <div class="card screen active" id="screen1">
    <div class="step-header">
      <h2 id="s1Title">お申し込み商品を選択してください</h2>
      <p id="s1Desc">ご希望の商品を1つお選びください。選択後、その商品の重要確認事項をご確認いただきます。</p>
    </div>

    <div class="product-grid">
      <label class="product-option" id="opt-evolution" onclick="selectProduct('evolution')">
        <input type="radio" name="product" value="evolution">
        <div class="check-icon">✓</div>
        <div class="product-type-badge badge-evolution" id="tag-evolution">積立変動型</div>
        <div class="product-name" id="name-evolution">エボリューション（積立変動型）</div>
      </label>

      <label class="product-option" id="opt-sp500" onclick="selectProduct('sp500')">
        <input type="radio" name="product" value="sp500">
        <div class="check-icon">✓</div>
        <div class="product-type-badge badge-sp500" id="tag-sp500">積立確定型</div>
        <div class="product-name" id="name-sp500">S&amp;P500（積立確定型）</div>
      </label>

      <label class="product-option" id="opt-fip" onclick="selectProduct('fip')">
        <input type="radio" name="product" value="fip">
        <div class="check-icon">✓</div>
        <div class="product-type-badge badge-fip" id="tag-fip">一括確定型</div>
        <div class="product-name" id="name-fip">確定利回りポートフォリオ（一括確定型）</div>
      </label>

      <label class="product-option" id="opt-platinum" onclick="selectProduct('platinum')">
        <input type="radio" name="product" value="platinum">
        <div class="check-icon">✓</div>
        <div class="product-type-badge badge-platinum" id="tag-platinum">一括変動型</div>
        <div class="product-name" id="name-platinum">プラチナプラス（一括変動型）</div>
      </label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn1Next" disabled onclick="goToStep(2)">
        <span id="btn1Text">次へ：重要事項を確認する →</span>
      </button>
    </div>
  </div>

  <!-- SCREEN 2: 重要事項 -->
  <div class="card screen" id="screen2">
    <div class="consent-header">
      <div class="product-badge" id="consentBadge">📄</div>
      <h2 id="consentTitle"></h2>
      <div class="preamble" id="consentPreamble"></div>
    </div>

    <div class="notice-box">
      <div class="notice-icon">⚠️</div>
      <p id="noticeText"></p>
    </div>

    <div class="articles" id="articlesContainer"></div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn2Back" onclick="goToStep(1)">← 戻る</button>
      <button class="btn btn-primary" id="btn2Next" disabled onclick="goToStep(3)">
        <span id="btn2Text">次へ：署名・承認へ →</span>
      </button>
    </div>
  </div>

  <!-- SCREEN 3: 署名・承認 -->
  <div class="card screen" id="screen3">
    <div class="step-header">
      <h2 id="s3Title">署名・最終承認</h2>
      <p id="s3Desc">以下の情報をご入力いただき、重要事項同意書への最終承認をお願いします。</p>
    </div>

    <div class="signature-section">
      <div class="sig-grid">
        <div class="field-group">
          <label id="labelName">お名前（フルネーム）<span style="color:red"> *</span></label>
          <input type="text" id="sigName" placeholder="Yamada, Taro" oninput="checkStep3()">
        </div>
        <div class="field-group">
          <label id="labelDate">署名日<span style="color:red"> *</span></label>
          <input type="date" id="sigDate" oninput="checkStep3()">
        </div>
        <div class="field-group field-full">
          <label id="labelEmail">メールアドレス（控え送付先）<span style="color:red"> *</span></label>
          <input type="email" id="sigEmail" placeholder="example@email.com" oninput="checkStep3()">
        </div>
      </div>

      <div class="confirm-box">
        <strong id="confirmTitle">承認内容の確認</strong>
        <div class="confirm-row">
          <span class="confirm-key" id="confirmKeyProduct">商品</span>
          <span class="confirm-val" id="confirmProduct"></span>
        </div>
        <div class="confirm-row">
          <span class="confirm-key" id="confirmKeyCount">記入条項数</span>
          <span class="confirm-val" id="confirmCount"></span>
        </div>
      </div>

      <label class="agree-check">
        <input type="checkbox" id="finalAgree" onchange="checkStep3()">
        <div class="agree-check-text" id="agreeText">
          上記の重要事項をすべて確認・理解し、自己の自由な意思に基づき本プランの申し込みを行うことに同意します。また、投資に伴うリスクを十分に理解した上で申し込みを行うことを確認します。
        </div>
      </label>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn3Back" onclick="goToStep(2)">← 戻る</button>
      <button class="btn btn-success" id="btn3Submit" disabled onclick="submitForm()">
        <span id="btn3Text">✓ 同意して承認する</span>
      </button>
    </div>
  </div>

  <!-- SCREEN 4: 完了 -->
  <div class="card screen" id="screen4">
    <div class="complete-section">
      <div class="complete-icon">✓</div>
      <h2 id="doneTitle">承認が完了しました</h2>
      <p id="doneMsg1" style="font-size:15px;color:#374151;margin-bottom:6px;"></p>
      <div class="complete-ref" id="refNumber"></div>
      <p class="email-sent-note" id="doneMsg2"></p>

      <div class="next-steps-box">
        <strong id="nextStepsTitle">📋 次のステップ</strong>
        <p id="nextStepsText"></p>
      </div>

      <div class="done-box">
        <strong id="doneSummaryTitle">承認済み内容</strong>
        <div class="done-row"><span class="done-key" id="doneKeyProduct">商品名</span><span id="doneProduct" style="font-weight:bold;color:#1e3a8a"></span></div>
        <div class="done-row"><span class="done-key" id="doneKeyName">お名前</span><span id="doneName"></span></div>
        <div class="done-row"><span class="done-key" id="doneKeyDate">署名日</span><span id="doneDate"></span></div>
        <div class="done-row"><span class="done-key" id="doneKeyRef">受付番号</span><span id="doneRef" style="font-family:monospace;font-weight:bold"></span></div>
      </div>

      <br>
      <button class="restart-btn" id="restartBtn" onclick="restartForm()">最初からやり直す</button>
    </div>
  </div>

</main>

<script>
/* =====================================================
   TRANSLATIONS
   ===================================================== */
let lang = 'ja';

const T = {
  hTagline:        { ja:'重要事項同意書 — オンライン承認システム', en:'Important Matters Consent Form — Online Approval System' },
  plabel1:         { ja:'商品選択',    en:'Select Product' },
  plabel2:         { ja:'重要事項確認', en:'Review' },
  plabel3:         { ja:'署名・承認',  en:'Sign & Approve' },
  plabel4:         { ja:'完了',        en:'Done' },
  s1Title:         { ja:'お申し込み商品を選択してください', en:'Please select your product' },
  s1Desc:          { ja:'ご希望の商品を1つお選びください。選択後、その商品の重要確認事項をご確認いただきます。', en:'Please select one product. You will then review the important matters for that product.' },
  'tag-evolution': { ja:'積立変動型',  en:'Variable Savings' },
  'tag-sp500':     { ja:'積立確定型',  en:'Fixed Savings' },
  'tag-fip':       { ja:'一括確定型',  en:'Lump-sum Fixed' },
  'tag-platinum':  { ja:'一括変動型',  en:'Lump-sum Variable' },
  'name-evolution':{ ja:'エボリューション（積立変動型）', en:'Evolution (Variable Savings Type)' },
  'name-sp500':    { ja:'S&P500（積立確定型）',           en:'S&P500 (Fixed Savings Type)' },
  'name-fip':      { ja:'確定利回りポートフォリオ（一括確定型）', en:'Fixed Yield Portfolio (Lump-sum Fixed Type)' },
  'name-platinum': { ja:'プラチナプラス（一括変動型）',   en:'Platinum Plus (Lump-sum Variable Type)' },
  btn1Text:        { ja:'次へ：重要事項を確認する →', en:'Next: Review Important Matters →' },
  btn2Back:        { ja:'← 戻る', en:'← Back' },
  btn2Text:        { ja:'次へ：署名・承認へ →', en:'Next: Sign & Approve →' },
  s3Title:         { ja:'署名・最終承認', en:'Signature & Final Approval' },
  s3Desc:          { ja:'以下の情報をご入力いただき、重要事項同意書への最終承認をお願いします。', en:'Please fill in the details below to complete your final approval of the consent form.' },
  labelName:       { ja:'お名前（フルネーム）', en:'Full Name' },
  labelDate:       { ja:'署名日', en:'Date of Signature' },
  labelEmail:      { ja:'メールアドレス（控え送付先）', en:'Email Address (confirmation copy)' },
  confirmTitle:    { ja:'承認内容の確認', en:'Confirmation of Approval Details' },
  confirmKeyProduct:{ ja:'商品', en:'Product' },
  confirmKeyCount: { ja:'記入条項数', en:'Articles Initialed' },
  agreeText:       { ja:'上記の重要事項をすべて確認・理解し、自己の自由な意思に基づき本プランの申し込みを行うことに同意します。また、投資に伴うリスクを十分に理解した上で申し込みを行うことを確認します。',
                     en:'I confirm that I have read and fully understood all of the above important matters, and I agree to apply for this plan of my own free will, having fully understood all associated investment risks.' },
  btn3Back:        { ja:'← 戻る', en:'← Back' },

function applyLang() {
  document.getElementById('btnJA').className = 'lang-btn' + (lang==='ja'?' active':'');
  document.getElementById('btnEN').className = 'lang-btn' + (lang==='en'?' active':'');
  Object.keys(T).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const val = T[id][lang];
    if (el.tagName === 'INPUT' || el.tagName === 'BUTTON') {
      el.textContent = val;
    } else {
      el.innerHTML = val;
    }
  });
  // Rebuild articles if on step 2
  if (selectedProduct && document.getElementById('screen2').classList.contains('active')) {
    buildArticles(products[selectedProduct]);
    checkAllInitials();
  }
  // Refresh step 3 dynamic text if visible
  if (selectedProduct && document.getElementById('screen3').classList.contains('active')) {
    refreshStep3();
  }
}

function setLang(l) {
  lang = l;
  applyLang();
}

/* =====================================================
   FORM LOGIC
   ===================================================== */
let selectedProduct = null;

function selectProduct(key) {
  selectedProduct = key;
  document.querySelectorAll('.product-option').forEach(el => el.classList.remove('selected'));
  document.getElementById('opt-' + key).classList.add('selected');
  document.getElementById('btn1Next').disabled = false;
}

function parseBody(text) {
  return text.split('\n').map(para => {
    let html = para
      .replace(/\[\[R:(.*?)\]\]/g, '<strong class="risk">$1</strong>')
      .replace(/\[\[B:(.*?)\]\]/g, '<strong>$1</strong>')
      .replace(/【(.*?)】/g, '<strong>【$1】</strong>');
    return `<p>${html}</p>`;
  }).join('');
}

function buildArticles(product) {
  const container = document.getElementById('articlesContainer');
  const saved = {};
  product.articles.forEach((_, i) => {
    const el = document.getElementById('initial-' + i);
    if (el) saved[i] = el.value;
  });

  container.innerHTML = '';
  const initialLabel = lang === 'ja' ? 'イニシャルをご記入：' : 'Enter your initials:';
  const initialHint  = lang === 'ja' ? '（山田　太郎さんの場合：T.Y）' : '(e.g. T.Y for Taro Yamada)';

  product.articles.forEach((art, i) => {
    const div = document.createElement('div');
    div.className = 'article';
    div.innerHTML = `
      <div class="article-title">
        <span class="article-title-text">${art.num[lang]}　${art.title[lang]}</span>
        <div class="initial-check" id="check-${i}">✓</div>
      </div>
      <div class="article-body">
        ${parseBody(art.body[lang])}
        <div class="initial-row">
          <span class="initial-label">${initialLabel}</span>
          <input class="initial-input" type="text" maxlength="6" placeholder="T.Y"
            id="initial-${i}" oninput="onInitialInput(${i},this.value)" autocomplete="off"
            value="${saved[i] || ''}">
          <span class="initial-hint">${initialHint}</span>
        </div>
      </div>`;
    container.appendChild(div);
    if (saved[i] && saved[i].trim().length > 0) {
      setTimeout(() => {
        const chk = document.getElementById('check-' + i);
        if (chk) chk.classList.add('filled');
      }, 0);
    }
  });
}

function onInitialInput(i, val) {
  const check = document.getElementById('check-' + i);
  check.classList.toggle('filled', val.trim().length > 0);
  checkAllInitials();
}

function checkAllInitials() {
  const allFilled = products[selectedProduct].articles.every((_, i) => {
    const v = document.getElementById('initial-' + i);
    return v && v.value.trim().length > 0;
  });
  document.getElementById('btn2Next').disabled = !allFilled;
}

function refreshStep3() {
  const p = products[selectedProduct];
  document.getElementById('confirmProduct').textContent = p.name[lang];
  const count = p.articles.length;
  document.getElementById('confirmCount').textContent = lang === 'ja'
    ? count + '条項すべて記入済み'
    : count + ' articles — all initialed';
}

function goToStep(step) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + step).classList.add('active');
  updateProgress(step);

  if (step === 2 && selectedProduct) {
    const p = products[selectedProduct];
    document.getElementById('consentBadge').textContent = '📄 ' + p.label[lang];
    document.getElementById('consentTitle').textContent = p.title[lang];
    document.getElementById('consentPreamble').textContent = p.preamble[lang];
    document.getElementById('noticeText').innerHTML = T.noticeText[lang];
    buildArticles(p);
    checkAllInitials();
  }

  if (step === 3) {
    refreshStep3();
    document.getElementById('sigDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('finalAgree').checked = false;
    document.getElementById('btn3Submit').disabled = true;
    applyLang(); // ensure labels are translated
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkStep3() {
  const ok = document.getElementById('sigName').value.trim() &&
             document.getElementById('sigDate').value &&
             document.getElementById('sigEmail').value.trim() &&
             document.getElementById('finalAgree').checked;
  document.getElementById('btn3Submit').disabled = !ok;
}

function submitForm() {
  const refNum   = 'WGS-' + Date.now().toString(36).toUpperCase().slice(-8);
  const p        = products[selectedProduct];
  const name     = document.getElementById('sigName').value.trim();
  const date     = document.getElementById('sigDate').value;
  const email    = document.getElementById('sigEmail').value.trim();
  const product  = p.name[lang];

  // Collect initials
  const initials = p.articles.map((art, i) => {
    const v = document.getElementById('initial-' + i) ? document.getElementById('initial-' + i).value : '';
    return `${art.num[lang]}: ${v}`;
  }).join('\n');

  // Send confirmation email via mailto
  const subject = encodeURIComponent(
    lang === 'ja'
      ? `【重要事項同意書 承認完了】受付番号: ${refNum}`
      : `[Consent Form Approved] Reference: ${refNum}`
  );
  const body = encodeURIComponent(
    lang === 'ja'
      ? `重要事項同意書の承認が完了しました。\n\n受付番号：${refNum}\n商品名：${product}\nお名前：${name}\n署名日：${date}\n\n--- イニシャル記入内容 ---\n${initials}\n\n※担当者より改めてご連絡いたします。\nWawasan Global Support Limited`
      : `Your Important Matters Consent Form has been approved.\n\nReference No.: ${refNum}\nProduct: ${product}\nName: ${name}\nDate: ${date}\n\n--- Initialed Articles ---\n${initials}\n\nYour representative will contact you shortly.\nWawasan Global Support Limited`
  );
  window.location.href = `mailto:${encodeURIComponent(email)}?subject=${subject}&body=${body}`;

  // Show completion screen
  document.getElementById('refNumber').textContent = refNum;
  document.getElementById('doneProduct').textContent = product;
  document.getElementById('doneName').textContent = name;
  document.getElementById('doneDate').textContent = date;
  document.getElementById('doneRef').textContent = refNum;
  document.getElementById('doneMsg1').textContent = T.doneMsg1[lang];
  document.getElementById('doneMsg2').textContent = T.doneMsg2[lang];
  document.getElementById('nextStepsText').textContent = T.nextStepsText[lang];

  goToStep(4);
  applyLang();
}

function restartForm() {
  selectedProduct = null;
  document.querySelectorAll('.product-option').forEach(el => el.classList.remove('selected'));
  document.getElementById('btn1Next').disabled = true;
  document.getElementById('sigName').value = '';
  document.getElementById('sigEmail').value = '';
  document.getElementById('finalAgree').checked = false;
  goToStep(1);
}

function updateProgress(step) {
  for (let i = 1; i <= 4; i++) {
    const num   = document.getElementById('pnum' + i);
    const label = document.getElementById('plabel' + i);
    if (i < step) {
      num.className = 'step-num done';
      num.textContent = '✓';
    } else if (i === step) {
      num.className = 'step-num active';
      num.textContent = i;
      label.className = 'step-label active';
    } else {
      num.className = 'step-num pending';
      num.textContent = i;
      label.className = 'step-label';
    }
    if (i < 4) {
      const line = document.getElementById('pline' + i);
      if (line) line.className = i < step ? 'step-line done' : 'step-line';
    }
  }
}

// Initial lang render
applyLang();
</script>
